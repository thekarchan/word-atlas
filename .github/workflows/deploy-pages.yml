name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Media lives in R2, so the build only needs the app + dataset.
      - name: Build
        run: npm run build
        env:
          # Repo variable overrides the default when the zone's anycast IPs are
          # throttled on some networks.
          VITE_ASSET_BASE: ${{ vars.ASSET_BASE || 'https://assets.hellokar.org' }}

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=word-atlas --branch=${{ github.ref_name }}
